function audioTone(freq,dur=.13,delay=0,vol=.16,type='sine',slide=0){if(!audioContext||audioContext.state!=='running')return;const osc=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime+delay;osc.type=type;osc.frequency.setValueAtTime(freq,t);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,settings.volume*vol),t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(gain);gain.connect(audioContext.destination);osc.start(t);osc.stop(t+dur+.03);}

function dispatch(action){if(busy)return;try{const before=state;state=G.act(state,action);persist();if(action.type==='end'){viewPlayer=null;modal=null;}if(action.type==='tradeOpen')modal={type:'trade'};if(action.type==='tradeCancel'||(action.type==='tradeAccept'&&state.phase!=='trade'))modal=null;if(['bankrupt','settle'].includes(action.type))modal=null;if(state.phase==='over')modal={type:'results'};
 const roll=['roll','orderRoll'].includes(action.type),motion=state.motion,duration=settings.reduced?0:roll?(settings.fast?220:600):0;busy=!!duration||!!(motion&&!settings.reduced);render();if((action.type==='build'||action.type==='buy')&&action.tile!==undefined)requestAnimationFrame(()=>ver2Burst(action.tile,action.type));
 sound(roll?'roll':state.phase==='debt'?'debt':state.phase==='card'?'card':['buy','build','card'].includes(action.type)?action.type:action.type==='settle'?'pay':'click');
 if(busy){const epoch=++animation;if(roll)$('turnPanel')?.classList.add('rolling');setTimeout(()=>{if(epoch!==animation)return;const m=motion;if(m&&!settings.reduced){let step=0;const total=Math.abs(m.steps),dir=Math.sign(m.steps);renderPawns({pid:m.pid,position:m.from});const tick=()=>{if(epoch!==animation)return;step++;renderPawns({pid:m.pid,position:(m.from+dir*step+80)%40});sound('step');if(step<total)setTimeout(tick,settings.fast?40:100);else{busy=false;render();}};tick();}else{busy=false;render();}},duration);}
 if(state.phase==='over'&&before.phase!=='over'){sound('win');confetti();}
 }catch(e){toast(e.message,true);render();}}


let aiTimer=null;
function aiActorId(s=state){if(!s||s.phase==='over')return null;if(s.phase==='order')return s.order?.candidates?.[s.order.index]??null;if(s.phase==='auction')return s.auction?.cursor??null;if(s.phase==='purchase')return s.purchase?.pid??null;if(s.phase==='card')return s.card?.pid??null;if(s.phase==='debt')return s.debt?.payer??null;if(s.phase==='trade'){const tr=s.trade;if(!tr)return null;if(s.players[tr.b]?.computer&&tr.accepted[0]&&!tr.accepted[1])return tr.b;return null;}return s.current;}
function aiActor(s=state){const id=aiActorId(s);return id===null?null:s?.players?.[id]?.computer?s.players[id]:null;}
function aiReserve(level){return level==='hard'?360:level==='medium'?300:220;}
function aiGroupProgress(s,pid,t){if(!t.group)return {owned:0,total:0,complete:false};const ids=GROUPS[t.group].ids,owned=ids.filter(id=>s.properties[id].owner===pid).length;return {owned,total:ids.length,complete:owned===ids.length};}
function aiPropertyValue(s,t,pid,level='medium'){let value=t.price;if(t.type==='street'){const g=aiGroupProgress(s,pid,t),after=g.owned+(s.properties[t.id].owner===pid?0:1);value*=1+(after/g.total)*(.22+(level==='hard'?.18:level==='medium'?.10:.03));if(after===g.total)value*=level==='hard'?1.75:level==='medium'?1.45:1.18;}else if(t.type==='transport'){const n=G.own(s,pid).filter(x=>x.type==='transport').length;value*=1+n*(level==='hard'?.18:.1);}else if(t.type==='utility'){const n=G.own(s,pid).filter(x=>x.type==='utility').length;value*=n?1.28:1.05;}return Math.round(value);}
function aiPurchaseAction(s,p){const t=TILES[s.purchase.tile],level=p.aiLevel||'medium';if(p.cash<t.price)return {type:'auction'};const reserve=aiReserve(level),value=aiPropertyValue(s,t,p.id,level),after=p.cash-t.price;if(level==='easy'){const buy=after>=reserve&&(Math.random()<.58||value>=t.price*1.18);return {type:buy?'buy':'auction',tile:t.id};}if(level==='medium'){const buy=(after>=reserve&&value>=t.price*.92)||(after>=120&&value>=t.price*1.35);return {type:buy?'buy':'auction',tile:t.id};}const buy=(after>=reserve&&value>=t.price*.82)||(after>=80&&value>=t.price*1.45);return {type:buy?'buy':'auction',tile:t.id};}
function aiAuctionAction(s,p){const a=s.auction,t=TILES[a.tile],level=p.aiLevel||'medium',next=a.high+10,reserve=aiReserve(level),value=aiPropertyValue(s,t,p.id,level);let max;if(level==='easy')max=Math.min(p.cash-reserve,Math.round(Math.min(t.price*.72,value*.62)/10)*10);else if(level==='medium')max=Math.min(p.cash-reserve,Math.round(Math.min(t.price*1.08,value*.98)/10)*10);else max=Math.min(p.cash-Math.min(reserve,p.cash*.18),Math.round(Math.min(t.price*1.42,value*1.18)/10)*10);if(level==='easy'&&Math.random()<.16&&a.high>0)max=Math.min(max,a.high);return next<=Math.max(0,max)?{type:'bid',amount:next,pid:p.id}:{type:'pass',pid:p.id};}
function aiBuildScore(s,t){const a=s.properties[t.id],next=Math.min(5,a.level+1);if(t.type!=='street')return 0;return (t.rents[next]-t.rents[a.level])/(G.cost(t)||1)+(t.price/1000);}
function aiManageAction(s,p){const level=p.aiLevel||'medium',reserve=aiReserve(level),assets=G.own(s,p.id);if(level!=='easy'){const mort=assets.filter(t=>s.properties[t.id].mortgaged&&!G.actionReason(s,'redeem',t.id,p.id)).sort((a,b)=>b.price-a.price);if(mort.length&&p.cash-G.redeem(mort[0])>=reserve+(level==='hard'?120:220))return {type:'redeem',tile:mort[0].id};}
 const buildable=assets.filter(t=>t.type==='street'&&!G.actionReason(s,'build',t.id,p.id)&&p.cash-G.cost(t)>=reserve).sort((a,b)=>aiBuildScore(s,b)-aiBuildScore(s,a));if(buildable.length){if(level==='easy'){if(p.cash>650&&Math.random()<.24)return {type:'build',tile:buildable[0].id};}else if(level==='medium'){if(p.cash>reserve+G.cost(buildable[0])+90)return {type:'build',tile:buildable[0].id};}else return {type:'build',tile:buildable[0].id};}return null;}
function aiDebtAction(s,p){const d=s.debt;if(p.cash>=d.amount)return {type:'settle'};const assets=G.own(s,p.id);const sellable=assets.filter(t=>t.type==='street'&&!G.actionReason(s,'sell',t.id,p.id)).sort((a,b)=>G.cost(b)-G.cost(a));if(sellable.length)return {type:'sell',tile:sellable[0].id};const mortgageable=assets.filter(t=>!G.actionReason(s,'mortgage',t.id,p.id)).sort((a,b)=>b.price-a.price);if(mortgageable.length)return {type:'mortgage',tile:mortgageable[0].id};if(G.liquidity(s,p.id)<d.amount)return {type:'bankrupt'};return null;}
function aiJailAction(s,p){const level=p.aiLevel||'medium';if(p.cards.length&&(level!=='easy'||Math.random()<.7))return {type:'jailCard',cardId:p.cards[0]};if(level==='hard'&&p.cash>=50&&(p.cash>260||p.jailFailures>=1))return {type:'jailPay'};if(level==='medium'&&p.cash>=50&&p.jailFailures>=1&&p.cash>320)return {type:'jailPay'};return {type:'roll'};}
function aiTradeBundleValue(s,owner,receiver,offer,level){let total=offer.cash+offer.cards.length*(level==='hard'?90:70);for(const id of offer.properties){const t=TILES[id];let v=t.price;const recv=aiGroupProgress(s,receiver,t);if(t.group&&recv.owned+1===recv.total)v*=level==='hard'?1.7:level==='medium'?1.4:1.15;const ownp=aiGroupProgress(s,owner,t);if(t.group&&ownp.complete)v*=level==='hard'?1.45:1.25;total+=v;}return total;}
function aiTradeAction(s,p){const tr=s.trade,level=p.aiLevel||'medium';const received=aiTradeBundleValue(s,tr.a,tr.b,tr.giveA,level),given=aiTradeBundleValue(s,tr.b,tr.a,tr.giveB,level),threshold=level==='hard'?1.08:level==='medium'?.96:.78;const accept=received>=given*threshold&&(level!=='easy'||Math.random()>.12);return accept?{type:'tradeAccept',side:1}:{type:'tradeCancel'};}
function aiChooseAction(s,p){switch(s.phase){case 'order':return {type:'orderRoll'};case 'ready':return aiManageAction(s,p)||{type:'roll'};case 'after':return aiManageAction(s,p)||(s.extra?{type:'roll'}:{type:'end'});case 'jail':return aiJailAction(s,p);case 'purchase':return aiPurchaseAction(s,p);case 'auction':return aiAuctionAction(s,p);case 'card':return {type:'card'};case 'debt':return aiDebtAction(s,p);case 'trade':return aiTradeAction(s,p);default:return null;}}
function scheduleAI(){clearTimeout(aiTimer);const p=aiActor();if(!p||busy||!state||state.phase==='over')return;const delay=settings.fast?180:(p.aiLevel==='hard'?430:p.aiLevel==='easy'?720:560);aiTimer=setTimeout(()=>{if(busy)return scheduleAI();const bot=aiActor();if(!bot)return;const action=aiChooseAction(state,bot);if(!action)return;action.rev=state.rev;dispatch(action);},delay);}


function openModal(type,data={}){focusBefore=document.activeElement;modal={type,...data};renderModal(true);}
function closeModal(){if(state?.phase==='trade'&&modal?.type==='trade')return;modal=null;renderModal();focusBefore?.focus?.();scheduleAI();}
function dialog(title,content,wide=false,closable=true){return `<div class="dialog-backdrop"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div class="dialog-header"><h2 id="dialogTitle">${title}</h2>${closable?'<button data-ui="close" class="dialog-close" aria-label="Đóng">×</button>':''}</div>${content}</section></div>`;}
function actionControls(t,p){if(!state)return '';const types=state.phase==='purchase'?['sell','mortgage']:['build','sell','mortgage','redeem'];return `<div class="action-grid ${state.phase==='purchase'?'fundraising-grid':''}">${types.map(type=>{const reason=G.actionReason(state,type,t.id,p),a=state.properties[t.id],label={build:`${a.level===4?'Nâng khách sạn':'Xây +1 nhà'} · ${money(G.cost(t))}`,sell:`Bán −1 mức · +${money(G.cost(t)/2)}`,mortgage:`Thế chấp · +${money(G.mortgage(t))}`,redeem:`Chuộc · ${money(G.redeem(t))}`}[type];if((type==='build'||type==='sell')&&t.type!=='street')return '';return `<div>${button(type,label,type==='sell'||type==='mortgage'?'secondary':'',!!reason,`data-tile="${t.id}" title="${esc(reason||label)}"`)}${reason?`<p class="action-help">${esc(reason)}</p>`:''}</div>`;}).join('')}</div>`;}
function rentTable(t){if(t.type==='street'){const a=state?.properties[t.id];return `<table><thead><tr><th>Mức phát triển</th><th>Tiền thuê</th></tr></thead><tbody>${[['Đất trống',t.rents[0]],['Đất trống, đủ bộ',t.rents[0]*2],...t.rents.slice(1).map((n,i)=>[i===4?'Khách sạn':`${i+1} nhà`,n])].map(([label,n],i)=>`<tr class="${a?.owner!==null&&a?.owner!==undefined&&!a.mortgaged&&G.rent(state,t.id)===n?'rent-highlight':''}"><td>${label}</td><td>${money(n)}</td></tr>`).join('')}</tbody></table>`;}
 if(t.type==='transport')return '<table><thead><tr><th>Số cơ sở cùng chủ</th><th>Phí</th></tr></thead><tbody>'+[25,50,100,200].map((n,i)=>`<tr><td>${i+1} cơ sở vận tải</td><td>${money(n)}</td></tr>`).join('')+'</tbody></table>';
 if(t.type==='utility')return '<div class="instructions-compact">Sở hữu 1 tiện ích: tổng xúc xắc × <strong>$4</strong>.<br>Sở hữu 2 tiện ích: tổng xúc xắc × <strong>$10</strong>.<br>Dùng tổng xúc xắc đã đưa bạn tới chuỗi sự kiện này.</div>';return '';}
function propertyContent(id){const t=TILES[id],a=state?.properties[id],owner=a?.owner,who=state?.phase==='debt'?state.debt.payer:state?.current;let content=`<div class="property-banner" style="--group:${t.group?GROUPS[t.group].color:'#c9ae54'}"><div class="property-illustration" style="${sprite(id)}" aria-hidden="true"></div><div><p class="eyebrow">Ô ${t.id} · ${t.group?'Nhóm '+t.group+' · '+GROUPS[t.group].name:typeNames[t.type]}</p><strong>${esc(t.name)}</strong>${t.price?`<div class="price">${money(t.price)}</div>`:''}</div></div>`;
 if(!t.price){const desc={go:'Nhận $250 khi tiến qua hoặc dừng đúng Xuất phát. Không thưởng lúc đặt quân ban đầu, đi lùi hoặc bị đưa vào tù. Ở chế độ 100 vòng → Sudden Death, sau khi hoàn tất vòng 100 thì khoản thưởng này về $0.',parking:'Nghỉ miễn phí. Không trả tiền và không nhận quỹ thưởng.',jail:'Đi tới ô này bình thường là thăm tù. Nếu đang bị giam: trả $50, dùng thẻ trước khi tung hoặc thử tung đôi tối đa 3 lượt.',gotojail:'Chuyển ngay đến Nhà tù ở ô 10, không nhận tiền Xuất phát và không được tung thêm.',chance:'Rút thẻ ở đầu bộ Cơ hội, thực hiện rồi trả về cuối bộ. Thẻ ra tù được giữ lại.',chest:'Rút thẻ ở đầu bộ Khí vận, thực hiện rồi trả về cuối bộ. Thẻ ra tù được giữ lại.',tax:`Trả ngân hàng ${money(t.tax)}. Đây là mức thu cố định trong trò chơi.`};return content+`<p>${desc[t.type]}</p>`;}
 content+=`<div class="facts"><div class="fact"><small>Chủ sở hữu</small><strong>${owner===null||owner===undefined?'Chưa có chủ':esc(state.players[owner].name)}</strong></div><div class="fact"><small>Trạng thái</small><strong>${a?levels(a):'Chưa xây'}</strong></div><div class="fact"><small>Thế chấp nhận</small><strong>${money(G.mortgage(t))}</strong></div><div class="fact"><small>Chuộc cả gốc và phí</small><strong>${money(G.redeem(t))}</strong></div></div>`;
 if(owner!==null&&owner!==undefined)content+=`<p class="instructions-compact">${a.mortgaged?'Tài sản đang thế chấp: không thu tiền thuê.':t.type==='utility'?`Phí hiện tại: tổng xúc xắc × <strong>$${G.own(state,owner).filter(x=>x.type==='utility').length===2?10:4}</strong>.`:`Thuê hiện tại: <strong>${money(G.rent(state,id))}</strong>. ${a.level?'Áp dụng mức công trình hiện có.':t.group&&G.fullGroups(state,owner).includes(t.group)?'Đã đủ bộ màu, tiền thuê đất trống được nhân đôi.':'Theo mức cơ bản hoặc số cơ sở cùng chủ.'}`}</p>`;
 content+=rentTable(t);if(t.group)content+=`<p class="small muted">Xây mỗi mức: ${money(G.cost(t))}. Bán mỗi mức: ${money(G.cost(t)/2)}. Phải xây/bán đồng đều; muốn xây cần đủ bộ và chuộc hết đất trong nhóm.</p>`;
 if(owner===who&&who!==undefined)content+=actionControls(t,who);return content;}
function manageContent(pid){const p=state.players[pid],assets=G.own(state,pid),debt=state.phase==='debt'&&state.debt.payer===pid,purchase=state.phase==='purchase'&&state.purchase?.pid===pid,pending=purchase?TILES[state.purchase.tile]:null,shortage=pending?Math.max(0,pending.price-p.cash):0;return `${debt?`<div class="sticky-debt"><strong>Cần trả ${money(state.debt.amount)} · Có ${money(p.cash)}</strong><p class="small">${esc(state.debt.reason)}. Chỉ bán công trình và thế chấp để huy động.</p><div class="btn-row" style="margin-top:8px">${button('settle','Thanh toán','primary',p.cash<state.debt.amount)}${G.liquidity(state,pid)<state.debt.amount?uiButton('bankruptcy','Xác nhận phá sản','danger'):''}</div></div>`:purchase?`<div class="purchase-fund-panel"><div><span class="eyebrow">Đang huy động để mua</span><strong>${esc(pending.name)} · ${money(pending.price)}</strong></div><div class="purchase-fund-money"><span>Tiền mặt</span><b>${money(p.cash)}</b></div><p>${shortage?`Còn thiếu <strong>${money(shortage)}</strong>. Chỉ bán công trình hoặc thế chấp tài sản để huy động thêm tiền.`:`<strong>Đã đủ tiền.</strong> Quay lại màn hình mua BĐS để hoàn tất.`}</p><div class="fund-progress"><span style="width:${Math.min(100,p.cash/pending.price*100)}%"></span></div>${uiButton('close',shortage?'← Quay lại màn hình mua':'← Quay lại và mua tài sản',shortage?'secondary':'primary')}</div>`:`<p class="intro">Tiền mặt: <strong>${money(p.cash)}</strong> · ${assets.length} tài sản. Mỗi nhóm màu phải xây và bán đồng đều.</p>`}${groupPills(state,pid)}<div class="manage-grid">${assets.length?assets.map(t=>`<article class="manage-tile" style="--group:${t.group?GROUPS[t.group].color:'#c7af60'}"><h3>${esc(t.name)}</h3><p class="small muted">${levels(state.properties[t.id])} · ${rentLabel(state,t)}</p>${actionControls(t,pid)}</article>`).join(''):'<p class="blank">Chưa sở hữu tài sản để quản lý.</p>'}</div>`;}
function tradeContent(){const tr=state.trade;if(!tr)return '';const after=JSON.parse(JSON.stringify(state));for(const [o,owner] of [[tr.giveA,tr.b],[tr.giveB,tr.a]])for(const id of o.properties)after.properties[id].owner=owner;let validation='';try{G.validateOffer(state,tr);}catch(e){validation=e.message;}
 return `<p class="intro">Mỗi bên đưa ra tiền, đất hoặc thẻ mình đang có. Hai người xác nhận riêng. Sửa đề nghị sẽ hủy cả hai xác nhận.</p><div class="trade-columns">${['A','B'].map((side,i)=>{const pid=tr[side.toLowerCase()],p=state.players[pid],offer=tr['give'+side],other=tr[side==='A'?'giveB':'giveA'],before=G.fullGroups(state,pid),later=G.fullGroups(after,pid),gain=later.filter(g=>!before.includes(g)),loss=before.filter(g=>!later.includes(g));return `<section class="trade-side"><h3>${TOKENS[p.token].icon} ${esc(p.name)} đưa ra</h3><label class="cash-label" for="tradeCash${side}">Tiền USD · Đang có ${money(p.cash)}</label><input id="tradeCash${side}" data-trade-side="${side}" data-trade-cash type="number" min="0" max="${p.cash}" step="1" value="${offer.cash}" inputmode="numeric"><div class="trade-list">${G.own(state,pid).map(t=>`<label class="trade-option"><input type="checkbox" data-trade-side="${side}" data-trade-prop="${t.id}" ${offer.properties.includes(t.id)?'checked':''} ${!G.canTradeTile(state,t.id,pid)?'disabled':''}><span>${esc(t.name)}<small>${state.properties[t.id].mortgaged?'Đang thế chấp · chuộc '+money(G.redeem(t)):!G.canTradeTile(state,t.id,pid)?'Cả nhóm còn công trình, chưa thể đổi chủ.':money(t.price)}</small></span></label>`).join('')}${p.cards.map(id=>`<label class="trade-option"><input type="checkbox" data-trade-side="${side}" data-trade-card="${id}" ${offer.cards.includes(id)?'checked':''}><span>Thẻ ra tù ${CARDS[id].deck==='chance'?'Cơ hội':'Khí vận'}</span></label>`).join('')}${!G.own(state,pid).length&&!p.cards.length?'<p class="small muted">Chưa có đất hoặc thẻ để trao đổi.</p>':''}</div><p class="trade-after">Tiền mặt: ${money(p.cash)} → <strong>${money(p.cash-offer.cash+other.cash)}</strong></p><p class="trade-group-change">${gain.length?'Hoàn thành nhóm '+gain.join(', ')+'. ':''}${loss.length?'Tách bộ nhóm '+loss.join(', ')+'.':''}${!gain.length&&!loss.length?'Không thay đổi số bộ màu hoàn chỉnh.':''}</p>${button('tradeAccept',p.computer?(tr.accepted[i]?'✓ Máy đã đồng ý':'🤖 Máy sẽ tự quyết định'):(tr.accepted[i]?'✓ Đã xác nhận':esc(p.name)+' xác nhận'),tr.accepted[i]?'accepted w-full':'primary w-full',!!validation||tr.accepted[i]||p.computer,`data-side="${i}"`)}</section>`;}).join('')}</div>${validation?`<p class="small muted" style="margin:14px 0">${esc(validation)}</p>`:''}<div class="btn-row" style="margin-top:16px">${button('tradeCancel','Hủy / Từ chối đề nghị','')}</div>`;}
function resultsContent(){const s=state,r=s.result;return `<div class="result-crown">🏆</div><h3 class="result-title">${r.winners.map(id=>esc(s.players[id].name)).join(' & ')} chiến thắng!</h3><p class="result-subtitle">${r.reason==='last'?(s.mode==='sudden100'&&s.suddenDeath?'Người cuối cùng chưa phá sản · Sudden Death':'Người cuối cùng chưa phá sản'):'Kết thúc 20 vòng lượt'} · Vòng ${r.round}</p><div class="result-table"><table><thead><tr><th>Người chơi</th><th>Tiền mặt</th><th>Giá tài sản</th><th>Công trình</th><th>Tiền chuộc</th><th>Tổng điểm</th></tr></thead><tbody>${r.ranking.map(x=>`<tr class="${r.winners.includes(x.id)?'result-winner':''}"><td><strong>${esc(s.players[x.id].name)}</strong></td><td>${money(x.cash)}</td><td>${money(x.land)}</td><td>${money(x.buildings)}</td><td>−${money(x.debt)}</td><td><strong>${money(x.total)}</strong></td></tr>`).join('')}</tbody></table></div><p class="small muted">Điểm = tiền mặt + giá niêm yết tài sản + chi phí công trình − tiền chuộc tài sản đang thế chấp. Hòa điểm thì so tiền mặt; vẫn bằng thì đồng hạng.</p>${r.ranking.map(x=>{const p=s.players[x.id];return `<p class="result-stat"><strong>${esc(p.name)}</strong> · ${x.count} tài sản · ${x.groups} bộ màu<br>Thuê đã thu: ${money(p.stats.rent)} · Qua Xuất phát: ${p.stats.go} · Vào tù: ${p.stats.jail} · Thắng đấu giá: ${p.stats.auctions}</p>`;}).join('')}${s.players.some(p=>p.bankrupt)?`<p class="small muted" style="margin-top:12px">Đã bị loại: ${s.players.filter(p=>p.bankrupt).sort((a,b)=>a.eliminatedAt-b.eliminatedAt).map(p=>esc(p.name)).join(' → ')}.</p>`:''}<div class="btn-row" style="margin-top:20px">${uiButton('new','Chơi lại','primary')}${uiButton('close','Xem bàn cờ')}${uiButton('home','Màn hình đầu')}</div>`;}
function rulesContent(){return `<div class="rules"><p class="intro">Bản Việt hóa tùy chỉnh · 1 người có thể đấu với Máy hoặc 2–6 người chơi chung một thiết bị. Toàn bộ giá và USD là giả lập trong game.</p>${[
 ['Mục tiêu & bắt đầu','Mỗi người nhận $2,000, đứng ở Xuất phát. Mọi người tung 2 xúc xắc chọn người đi đầu; chỉ những người hòa cao nhất tung lại. Sau đó lượt đi theo số ghế. Chế độ Tiêu chuẩn: người cuối cùng chưa phá sản thắng. Chế độ 20 vòng lượt: mỗi người còn chơi có 1 lượt mỗi vòng; sau vòng 20 xếp hạng điểm tài sản. Chế độ 100 vòng → Sudden Death: chơi như Tiêu chuẩn; nếu hoàn tất vòng 100 mà vẫn còn từ 2 người trở lên, Sudden Death bắt đầu từ vòng 101 và tiếp tục tới khi chỉ còn một người.'],
 ['Chơi với Máy','Khi chọn “1 + Máy”, bạn đấu 1–1 với Máy Sài Gòn. Máy tự tung xúc xắc, mua hoặc đưa tài sản ra đấu giá, ra giá trong đấu giá, dùng thẻ, xử lý nhà tù, xây dựng, thế chấp và trả nợ. Dễ: quyết định thoải mái và kém tối ưu hơn. Trung bình: cân bằng tiền mặt, tài sản và xây dựng. Khó: ưu tiên hoàn thành bộ màu, định giá đấu giá cao hơn và xây dựng chiến lược hơn. Khi giao dịch, bạn lập đề nghị và xác nhận phía mình; Máy tự quyết định chấp nhận hoặc từ chối.'],
 ['Đi quân, số đôi & Xuất phát','Đi theo tổng hai xúc xắc. Đôi lần 1 và 2 được tung thêm sau khi xử lý xong ô; đôi lần 3 trong cùng lượt vào tù ngay, không đi tiếp. Tiến qua hoặc dừng tại Xuất phát nhận $250 đúng một lần. Đi lùi, đặt quân ban đầu và đi thẳng vào tù không được thưởng. Khi Sudden Death đã kích hoạt, qua hoặc dừng tại Xuất phát không nhận tiền, kể cả khi di chuyển bằng thẻ.'],
 ['Mua đất & đấu giá','Dừng ở tài sản vô chủ: mua giá niêm yết hoặc đưa ra đấu giá. Chưa đủ tiền vẫn phải mở đấu giá, không huy động tiền giữa quyết định mua. Tất cả người còn chơi được đấu, kể cả người từ chối mua hoặc ở tù. Người kế tiếp theo ghế ra giá đầu tiên. Giá từ $10, bội số $10, mỗi lần tăng ít nhất $10 và không vượt tiền mặt. Rút thì không quay lại. Người dẫn không tự nâng giá; tất cả còn lại rút thì họ thắng. Không ai đặt giá thì tài sản vẫn vô chủ.'],
 ['Tiền thuê & bộ màu','Dừng ở tài sản người khác thì trả tiền thuê tự động. Đất trống đủ nhóm màu thu gấp đôi; đã xây nhà/khách sạn thì theo đúng bảng thuê. Đất của mình hoặc chính ô đang thế chấp không thu tiền. Sở hữu 1/2/3/4 vận tải thu $25/$50/$100/$200. Tiện ích thu tổng xúc xắc × $4 khi chủ có 1 ô, × $10 khi có 2 ô. Vẫn đếm quyền sở hữu của ô khác đang thế chấp.'],
 ['Xây nhà, khách sạn & bán công trình','Chỉ xây khi có toàn bộ nhóm màu và không ô nào trong nhóm đang thế chấp. Xây đồng đều: chênh lệch mức giữa các đường không quá 1. Sau 4 nhà, trả thêm đúng một giá xây để lên khách sạn. Bán cũng đồng đều, nhận 50% giá xây cho mỗi mức hạ. Khách sạn xuống 4 nhà chỉ hoàn nửa giá một mức. Nguồn nhà không giới hạn, mỗi ô tối đa 1 khách sạn.'],
 ['Thế chấp & chuộc','Thế chấp nhận 50% giá niêm yết, vẫn giữ tài sản nhưng ô đó không thu thuê. Phải bán hết công trình trong cả nhóm trước khi thế chấp. Chuộc trả khoản đã nhận + 10% khoản đó, không tính lãi theo vòng. Chuyển chủ vẫn giữ thế chấp và không thu phí lúc chuyển.'],
 ['Nhà tù','Đi đến ô Nhà tù bình thường chỉ là thăm tù. Bị giam khi gặp ô/thẻ vào tù hoặc đôi 3 lần. Đầu lượt ở tù: trả $50 hoặc dùng thẻ trước khi tung để đi bình thường; hoặc thử tung đôi. Ra tù bằng đôi thì đi theo tổng đó nhưng không tung thêm. Hai lần đầu không đôi thì ở lại. Lần thứ 3 không đôi buộc trả $50 rồi đi theo tổng vừa tung; không dùng thẻ thay khoản phạt này. Ở tù vẫn thu thuê và đấu giá.'],
 ['Cơ hội, Khí vận & các ô khác','Mỗi bộ có 16 thẻ; rút đầu bộ, xử lý xong trả cuối bộ. Thẻ ra tù giữ ngoài bộ cho tới lúc dùng. Thẻ di chuyển phải xử lý ô đến và có thể rút thẻ tiếp. Tiện ích dùng tổng xúc xắc gốc. Phí sửa chữa chốt lúc rút, bán nhà để trả nợ không giảm hóa đơn. Sinh nhật thu lần lượt $20 từ mỗi người khác; người ngoài lượt vẫn phải xử lý nợ. Thuế thu nhập $150, thuế tài sản $100. Bãi đỗ xe chỉ nghỉ, không phát thưởng.'],
 ['Giao dịch','Trong lượt mình, trước khi tung hoặc sau khi xử lý xong ô, được đề nghị đổi tiền, tài sản và thẻ ra tù với một người khác. Cả nhóm phải không còn công trình mới được trao đổi đất. Không trao đổi lời hứa, tiền vay hoặc quyền miễn thuê. Cả hai xác nhận riêng; sửa đề nghị hủy xác nhận. Tiền đưa ra không vượt tiền mặt trước giao dịch.'],
 ['Thiếu tiền & phá sản','Game dừng tại khoản nợ. Chỉ được bán công trình, thế chấp hoặc thanh toán khi đủ tiền; không xây, chuộc, giao dịch hay bỏ lượt. Chỉ được phá sản nếu tiền mặt + nửa chi phí công trình + khoản thế chấp các tài sản chưa thế chấp vẫn thiếu. Nợ người khác: thanh lý công trình, chuyển tiền, đất và thẻ cho chủ nợ. Nợ ngân hàng: thu hồi, xóa thế chấp và đấu giá lần lượt. Nếu còn 1 người thì chốt thắng ngay.'],
 ['Lưu ván & tính điểm','Game tự lưu trên cùng trình duyệt sau mỗi hành động. Trong Ván chơi, xuất bản lưu JSON để chuyển thiết bị hoặc nhập để tiếp tục. Có thể khôi phục ngay giữa thẻ, đấu giá hay nợ. Điểm kết thúc 20 vòng = tiền mặt + giá niêm yết tài sản + toàn bộ chi phí công trình − tiền chuộc các tài sản đang thế chấp. Thẻ ra tù không có điểm. Hòa điểm xét tiền mặt, vẫn hòa thì đồng hạng.']
 ].map(([title,text],i)=>`<details ${i===0?'open':''}><summary>${title}</summary><p>${text}</p></details>`).join('')}<details><summary>Bảng nhóm màu và giá xây</summary><table><thead><tr><th>Nhóm</th><th>Giá xây / mức</th></tr></thead><tbody>${Object.entries(GROUPS).map(([k,g])=>`<tr><td><strong>${k} · ${g.name}</strong><br><small>${g.ids.map(id=>TILES[id].name).join(', ')}</small></td><td>${money(g.cost)}</td></tr>`).join('')}</tbody></table></details></div>`;}
function renderModal(focus=false){const root=$('modalRoot');if(!modal){root.innerHTML='';document.body.style.overflow='';return;}const type=modal.type;let html='';
 if(type==='property')html=dialog('Chi tiết ô trên bàn cờ',propertyContent(modal.tile));
 if(type==='manage'){const pid=state.phase==='debt'?state.debt.payer:modal.pid??state.current;html=dialog(`Tài sản của ${esc(state.players[pid].name)}`,manageContent(pid),true);}
 if(type==='trade')html=dialog('Đề nghị giao dịch',tradeContent(),true,false);
 if(type==='tradePicker')html=dialog('Muốn giao dịch với ai?',`<p class="intro">Chọn một người để lập đề nghị trao đổi tài sản, tiền hoặc thẻ.</p><div class="file-menu">${state.players.filter(p=>p.id!==state.current&&!p.bankrupt).map(p=>button('tradeOpen',`${TOKENS[p.token].icon} ${esc(p.name)} · ${money(p.cash)}`,'',false,`data-pid="${p.id}"`)).join('')}</div>`);
 if(type==='rules')html=dialog('Luật dạo phố Sài Gòn',rulesContent());
 if(type==='settings')html=dialog('Âm thanh & chuyển động',`<label class="option-row"><span>Âm thanh hiệu ứng</span><input type="checkbox" data-setting="sound" ${settings.sound?'checked':''}></label><label class="option-row"><span>Âm lượng</span><input type="range" min="0" max="1" step="0.05" value="${settings.volume}" data-setting="volume" aria-label="Âm lượng"></label><label class="option-row"><span>Di chuyển nhanh</span><input type="checkbox" data-setting="fast" ${settings.fast?'checked':''}></label><label class="option-row"><span>Giảm chuyển động</span><input type="checkbox" data-setting="reduced" ${settings.reduced?'checked':''}></label><p class="small muted" style="margin-top:16px">Tắt hiệu ứng không làm thay đổi kết quả xúc xắc hoặc luật chơi.</p>`);
 if(type==='files')html=dialog('Ván chơi',`<p class="intro">${state?'Tiến trình được tự lưu trên trình duyệt này. Bạn cũng có thể tải bản lưu để giữ lại hoặc chuyển sang máy khác.':'Nhập một bản lưu có sẵn, hoặc bắt đầu ván mới.'}</p><div class="file-menu">${uiButton('export','↓ Xuất bản lưu JSON','',state?'':'disabled')}${uiButton('import','↑ Nhập bản lưu JSON')}${uiButton('new','＋ Thiết lập ván mới')}${state?uiButton('home','⌂ Màn hình đầu · giữ ván đã lưu'):''}</div>`);
 if(type==='replaceStart')html=dialog('Bắt đầu một ván mới?',`<p>Ván đang lưu sẽ được thay bằng ván mới. Bạn có thể xuất bản lưu trước khi bắt đầu.</p><div class="btn-row" style="margin-top:20px">${uiButton('export','Xuất bản lưu')}${uiButton('confirmStart','Bắt đầu ván mới','primary')}</div>`);
 if(type==='importConfirm')html=dialog('Tiếp tục từ bản lưu này?',`<p><strong>${pendingImport.players.length} người</strong> · Vòng ${pendingImport.round} · ${modeName(pendingImport.mode,pendingImport.suddenDeath)}.</p><p class="intro" style="margin-top:10px">Bản lưu này sẽ thay tiến trình hiện tại trên trình duyệt. Xuất ván hiện tại trước nếu bạn muốn giữ cả hai.</p><div class="btn-row">${state?uiButton('export','Xuất ván hiện tại'):''}${uiButton('confirmImport','Nhập và tiếp tục','primary')}</div>`);
 if(type==='bankruptcy'){const d=state.debt,p=state.players[d.payer];html=dialog('Xác nhận phá sản',`<p><strong>${esc(p.name)}</strong> đang nợ ${money(d.amount)}, nhưng tổng tiền tối đa có thể huy động chỉ là ${money(G.liquidity(state,p.id))}.</p><p class="intro" style="margin-top:12px">${d.payee===null?'Ngân hàng sẽ thanh lý công trình, thu hồi tiền và tài sản. Tài sản sẽ được đấu giá nếu ván tiếp tục.':`Công trình sẽ bán lại cho ngân hàng. Tiền còn lại, tài sản và thẻ được chuyển cho ${esc(state.players[d.payee].name)}; các thế chấp vẫn giữ nguyên.`}</p><div class="btn-row">${uiButton('close','Quay lại')}${button('bankrupt','Xác nhận phá sản','danger')}</div>`);}
 if(type==='results')html=dialog('Tổng kết chuyến dạo phố',resultsContent(),true);
 root.innerHTML=html;document.body.style.overflow='hidden';if(focus||!document.activeElement?.closest('.dialog'))root.querySelector('.dialog')?.focus();}
function captureSetup(){document.querySelectorAll('[data-name-index]').forEach(i=>setup.names[+i.dataset.nameIndex]=i.value);}
function logComputerStart(s){if(!s?.players?.[1]?.computer)return;s.logs.push({id:++s.logSeq,text:`Chế độ đấu với Máy · Cấp ${aiLevelName(s.players[1].aiLevel)}.`,kind:'info',round:s.round});}
function startGame(){state=pendingStart;pendingStart=null;saved=state;viewPlayer=null;sideTab='assets';modal=null;persist();render();sound('buy');}
function downloadJSON(s){if(!s)return;const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Co_Ty_Phu_Sai_Gon_Vong_${s.round}_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Đã xuất bản lưu ván chơi.');}
function goDecision(){if(state?.phase==='over'){openModal('results');return;}if(window.innerWidth<=600){const scroll=$('boardScroll'),b=$('board');scroll.scrollTo({left:(b.offsetWidth-scroll.clientWidth)/2,top:160,behavior:settings.reduced?'auto':'smooth'});} $('turnPanel')?.scrollIntoView({behavior:settings.reduced?'auto':'smooth',block:'center',inline:'center'});}
function routeUI(ui,el){if(busy&&['start','new','home','continue','confirmImport','confirmStart'].includes(ui))return;
 switch(ui){
 case 'property':openModal('property',{tile:+el.dataset.tile});break;
 case 'close':closeModal();break;
 case 'count':captureSetup();setup.count=+el.dataset.n;render();break;
 case 'aiLevel':setup.aiLevel=el.dataset.level;render();break;
 case 'mode':captureSetup();setup.mode=el.dataset.mode;render();break;
 case 'start':captureSetup();try{const solo=setup.count===1,names=solo?[setup.names[0],'Máy Sài Gòn']:setup.names.slice(0,setup.count),tokens=solo?[setup.tokens[0],setupBotToken()]:setup.tokens.slice(0,setup.count);pendingStart=G.createGame(names,setup.mode,tokens);if(solo){pendingStart.players[1].computer=true;pendingStart.players[1].aiLevel=setup.aiLevel;pendingStart.players[1].name='Máy Sài Gòn';logComputerStart(pendingStart);}if(saved)openModal('replaceStart');else startGame();}catch(e){toast(e.message,true);}break;
 case 'confirmStart':startGame();break;
 case 'new':modal=null;if(state){persist();state=null;}viewPlayer=null;render();$('sidebar').scrollIntoView({block:'nearest',behavior:'smooth'});break;
 case 'home':modal=null;if(state)persist();state=null;viewPlayer=null;render();break;
 case 'continue':if(saved){try{state=G.validate(JSON.parse(JSON.stringify(saved)));modal=state.phase==='trade'?{type:'trade'}:state.phase==='over'?{type:'results'}:null;render();}catch(e){toast(e.message,true);}}break;
 case 'settings':case 'rules':case 'files':openModal(ui);break;
 case 'export':downloadJSON(state||saved);break;
 case 'import':$('importInput').value='';$('importInput').click();break;
 case 'confirmImport':if(pendingImport){state=pendingImport;pendingImport=null;viewPlayer=null;modal=state.phase==='trade'?{type:'trade'}:state.phase==='over'?{type:'results'}:null;persist();render();toast('Đã khôi phục ván chơi.');}break;
 case 'manage':if(state){const requested=el.dataset.pid!==undefined?+el.dataset.pid:null,pid=state.phase==='debt'?state.debt.payer:state.phase==='purchase'?state.purchase.pid:requested??viewPlayer??state.current;openModal('manage',{pid});}break;
 case 'bankruptcy':if(state?.phase==='debt')openModal('bankruptcy');break;
 case 'tradePicker':if(state&&G.safe(state))openModal('tradePicker');break;
 case 'tradeResume':if(state?.phase==='trade')openModal('trade');break;
 case 'results':if(state?.phase==='over')openModal('results');break;
 case 'tab':sideTab=el.dataset.tab;render();break;
 case 'player':viewPlayer=+el.dataset.pid;sideTab='assets';render();break;
 case 'fullscreen':try{const task=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();task?.catch(()=>toast('Bạn có thể nhấn F11 để mở toàn màn hình.'));}catch{toast('Bạn có thể nhấn F11 để mở toàn màn hình.');}break;
 case 'locate':if(state){$('tile-'+state.players[state.current].position)?.scrollIntoView({block:'center',inline:'center',behavior:settings.reduced?'auto':'smooth'});}break;
 case 'decision':goDecision();break;
 case 'gotoSetup':$('sidebar').scrollIntoView({block:'start',behavior:settings.reduced?'auto':'smooth'});break;
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.act){let action={type:el.dataset.act,rev:+el.dataset.rev};if(el.dataset.tile!==undefined)action.tile=+el.dataset.tile;if(el.dataset.pid!==undefined)action.pid=+el.dataset.pid;if(el.dataset.side!==undefined)action.side=+el.dataset.side;if(el.dataset.cardId)action.cardId=el.dataset.cardId;if(action.type==='bid')action.amount=Number($('bidAmount')?.value);dispatch(action);}else if(el.dataset.ui){sound('click');routeUI(el.dataset.ui,el);}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.nameIndex!==undefined)setup.names[+el.dataset.nameIndex]=el.value;});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.tokenIndex!==undefined){const idx=+el.dataset.tokenIndex,next=+el.value,prev=setup.tokens[idx],other=setup.tokens.findIndex((x,i)=>i!==idx&&x===next);setup.tokens[idx]=next;if(other>=0)setup.tokens[other]=prev;captureSetup();render();}
 if(el.dataset.setting){settings[el.dataset.setting]=el.type==='checkbox'?el.checked:Number(el.value);savePrefs();if(el.dataset.setting==='sound'&&settings.sound)sound('click');}
 if(el.dataset.tradeSide&&state?.phase==='trade'){const side=el.dataset.tradeSide,offer=JSON.parse(JSON.stringify(state.trade['give'+side]));if(el.hasAttribute('data-trade-cash'))offer.cash=Number(el.value);if(el.dataset.tradeProp!==undefined){const id=+el.dataset.tradeProp;offer.properties=el.checked?[...offer.properties,id]:offer.properties.filter(x=>x!==id);}if(el.dataset.tradeCard){const id=el.dataset.tradeCard;offer.cards=el.checked?[...offer.cards,id]:offer.cards.filter(x=>x!==id);}dispatch({type:'tradeEdit',side,offer,rev:state.rev});}
});
$('importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>3*1024*1024)throw Error('Bản lưu quá lớn. Hãy chọn file JSON do game xuất ra.');const candidate=G.validate(JSON.parse(await file.text()));pendingImport=candidate;openModal('importConfirm');}catch(error){toast('Không nhập được bản lưu: '+error.message,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){if(state?.phase==='trade'&&modal.type==='trade'){toast('Dùng nút “Hủy / Từ chối đề nghị” để đóng giao dịch.');return;}closeModal();}
 if(e.key==='Tab'&&modal){const list=Array.from($('modalRoot').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),summary,[tabindex="0"]'));if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('dialog'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
window.addEventListener('beforeunload',()=>{if(state)persist();});
function confetti(){if(settings.reduced)return;const canvas=$('celebration'),ctx=canvas.getContext('2d');if(!ctx)return;canvas.width=innerWidth;canvas.height=innerHeight;const pieces=Array.from({length:110},()=>({x:Math.random()*canvas.width,y:-Math.random()*canvas.height,v:2+Math.random()*4,w:5+Math.random()*6,r:Math.random()*6,spin:Math.random()*.15,color:['#efc64b','#e36753','#15856e','#72bbd3','#f794b1'][Math.floor(Math.random()*5)]}));const start=performance.now();function tick(now){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of pieces){p.y+=p.v;p.x+=Math.sin(p.r);p.r+=p.spin;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);ctx.restore();}if(now-start<4200)requestAnimationFrame(tick);else ctx.clearRect(0,0,canvas.width,canvas.height);}requestAnimationFrame(tick);}
render();
})();
</script>
</body>
</html>
